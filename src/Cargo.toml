[package]
name = "geminui"
version = "0.11.0"
description = "Native multi-project desktop client for Gemini CLI"
authors = ["Dominik"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "geminui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "lib.rs"

[[bin]]
name = "geminui"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["reqwest-client"]
reqwest-client = []

[dependencies]
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "3"
pdf-extract = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
