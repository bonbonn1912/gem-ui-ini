name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src/Cargo.toml
      - run: cargo clippy --manifest-path src/Cargo.toml --all-targets -- -D warnings
      - run: npm exec tauri -- build --config src/tauri.conf.json --target x86_64-pc-windows-msvc
      - name: Extract package version
        id: pkg_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: geminUI-${{ steps.pkg_version.outputs.version }}-windows-x64
          path: |
            src/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
