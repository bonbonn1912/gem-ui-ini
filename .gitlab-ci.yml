stages:
  - build

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm ci
  script:
    - npm run typecheck
    - npm test
    - npm run make
    - $VERSION = (Get-Content package.json | ConvertFrom-Json).version
    - echo "PACKAGE_VERSION=$VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    name: "geminUI-$PACKAGE_VERSION-windows-x64"
    paths:
      - out/make/squirrel.windows/x64/*.exe
      - out/make/squirrel.windows/x64/*.nupkg
      - out/make/squirrel.windows/x64/RELEASES
    expire_in: 30 days
